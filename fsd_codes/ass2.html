
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: lightblue;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            background-color: black;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: navy;
            color: white;
        }

        form {
        background-color: white;
        padding: 20px;
        max-width: 400px;
        margin: 0 auto;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px;
            border: none;
        }

        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 8px;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Admission Portal</h1>
        <p>Welcome to our college</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#students">Students</a>
        <a href="#register">Registration</a>
    </nav>

    <section id="home">
        <h2>About Admission</h2>
        <p>Register here to apply for admission to our college.</p>
    </section>

    <section id="students">
        <h2>Student Details</h2>

        <table>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Department</th>
                <th>Year</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Aarav</td>
                <td>AI & DS</td>
                <td>Second</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Priya</td>
                <td>Computer</td>
                <td>First</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Rohan</td>
                <td>IT</td>
                <td>Third</td>
            </tr>
        </table>
    </section>

    <section id="register">
        <h2>Student Registration Form</h2>

        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Department:</label>
            <select required>
                <option value="">Select department</option>
                <option>AI & DS</option>
                <option>Computer</option>
                <option>IT</option>
            </select>

            <label>Phone Number:</label>
            <input type="tel" placeholder="Enter phone number">

            <button type="submit">Register</button>
        </form>
    </section>

</body>
</html>
