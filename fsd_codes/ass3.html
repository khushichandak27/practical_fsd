
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Management</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            color: navy;
        }

        form {
            background-color: white;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: navy;
            color: white;
        }

        #message {
            text-align: center;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Result Management System</h1>

    <form id="resultForm">
        <label>Student Name:</label>
        <input type="text" id="name" required>

        <label>Roll Number:</label>
        <input type="number" id="roll" required>

        <label>Subject 1 Marks (out of 100):</label>
        <input type="number" id="m1" min="0" max="100" required>

        <label>Subject 2 Marks (out of 100):</label>
        <input type="number" id="m2" min="0" max="100" required>

        <label>Subject 3 Marks (out of 100):</label>
        <input type="number" id="m3" min="0" max="100" required>

        <button type="submit">Calculate Result</button>
    </form>

    <p id="message"></p>

    <h2>Result Table</h2>

    <table id="resultTable">
        <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Total</th>
            <th>Percentage</th>
        </tr>
    </table>

    <h2 id="topper">Topper: Not calculated yet</h2>

    <script>
        let form = document.getElementById("resultForm");
        let table = document.getElementById("resultTable");
        let message = document.getElementById("message");

        let highest = -1;
        let topperName = "";

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            let total = m1 + m2 + m3;
            let percentage = (total / 300) * 100;

            let row = table.insertRow();
            row.insertCell(0).innerText = roll;
            row.insertCell(1).innerText = name;
            row.insertCell(2).innerText = total;
            row.insertCell(3).innerText = percentage.toFixed(2) + "%";

            message.innerText = "Result calculated successfully!";

            if (total > highest) {
                highest = total;
                topperName = name;

                document.getElementById("topper").innerText =
                    "Topper: " + topperName + " (" + highest + " marks)";
            }

            form.reset();
        });
    </script>

</body>
</html>
