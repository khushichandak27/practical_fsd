
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: navy;
        }

        form {
            background-color: white;
            max-width: 350px;
            margin: 20px auto;
            padding: 20px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        #result {
            text-align: center;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Student Marks Calculator</h1>

    <form id="marksForm">
        <label>Student Name:</label>
        <input type="text" id="name" required>

        <label>Subject 1 Marks:</label>
        <input type="number" id="m1" min="0" max="100" required>

        <label>Subject 2 Marks:</label>
        <input type="number" id="m2" min="0" max="100" required>

        <label>Subject 3 Marks:</label>
        <input type="number" id="m3" min="0" max="100" required>

        <button type="submit">Calculate</button>
    </form>

    <div id="result"></div>

    <script>
        let form = document.getElementById("marksForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);

            let total = m1 + m2 + m3;
            let percentage = total / 300 * 100;
            let grade;

            if (percentage >= 90) {
                grade = "A";
            } else if (percentage >= 75) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 40) {
                grade = "D";
            } else {
                grade = "Fail";
            }

            document.getElementById("result").innerHTML =
                "Student: " + name + "<br>" +
                "Total Marks: " + total + " / 300<br>" +
                "Percentage: " + percentage.toFixed(2) + "%<br>" +
                "Grade: " + grade;
        });
    </script>

</body>
</html>
